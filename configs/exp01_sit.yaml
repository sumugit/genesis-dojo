# exp01: 人手で1周（お座り）。報酬は人が書いた pai_loop/rewards/sit.py。
exp_name: exp01_sit
instruction: お座りして
seed: 1
sim: genesis
num_envs: 4096
max_iterations: 300

env:
  joint_names: [FR_hip_joint, FR_thigh_joint, FR_calf_joint,
                FL_hip_joint, FL_thigh_joint, FL_calf_joint,
                RR_hip_joint, RR_thigh_joint, RR_calf_joint,
                RL_hip_joint, RL_thigh_joint, RL_calf_joint]
  default_joint_angles:  # standing pose [rad], same as the official Go2 example
    FL_hip_joint: 0.0
    FR_hip_joint: 0.0
    RL_hip_joint: 0.0
    RR_hip_joint: 0.0
    FL_thigh_joint: 0.8
    FR_thigh_joint: 0.8
    RL_thigh_joint: 1.0
    RR_thigh_joint: 1.0
    FL_calf_joint: -1.5
    FR_calf_joint: -1.5
    RL_calf_joint: -1.5
    RR_calf_joint: -1.5
  kp: 20.0
  kd: 0.5
  base_init_pos: [0.0, 0.0, 0.42]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length_s: 10.0
  action_scale: 0.25
  clip_actions: 100.0

obs_scales:
  ang_vel: 0.25
  dof_pos: 1.0
  dof_vel: 0.05

reward:
  module: pai_loop.rewards.sit
  params:
    pitch_target: 0.70        # rad (~40 deg nose up)
    pitch_tolerance: 0.70     # rad; reward reaches 0 at this error
    height_target: 0.22       # m, trunk centre
    height_sigma: 0.06
    foot_contact_z: 0.05      # m; foot centre above this counts as lifted
    w_pitch: 2.0
    w_height: 1.0
    w_feet_lift: 10.0
    w_roll: 2.0
    w_drift: 1.0
    w_action_rate: 0.01
    w_dof_vel: 0.0005
    fail_nose_up_deg: 75
    fail_nose_down_deg: 20
    fail_roll_deg: 30
    fail_min_height: 0.08

train:  # rsl_rl OnPolicyRunner config (PPO settings follow the official Go2 example)
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.01
    gamma: 0.99
    lam: 0.95
    learning_rate: 0.001
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    use_clipped_value_loss: true
    value_loss_coef: 1.0
  actor:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    distribution_cfg: {class_name: GaussianDistribution, init_std: 1.0, std_type: scalar}
  critic:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
  obs_groups: {actor: [policy], critic: [policy]}
  num_steps_per_env: 24
  save_interval: 100
  logger: tensorboard

record:
  seconds: 6.0
  res: [1280, 720]
  fov: 40
  cam_offset: [0.8, -1.8, 0.5]  # side-front view, relative to the robot
  settle_s: 3.0                 # metrics are averaged after this time
