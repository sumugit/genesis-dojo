# 「しゃがんで忍び足で円を描いて歩いて」の数値の成功条件。ダッシュボードで作成（2026-10-30 09:40）。
# 人がダッシュボード上で確認・修正して承認した（approved: true）。
# 学習の土台: configs/base_walk.yaml
task: crouch_sneak_circle_v2
approved: true
window_s: [3.5, 8]
criteria:
- metric: height_m
  between: [0.16, 0.23]
  min_fraction: 0.9
  comment: 立位(約0.29m)より明確に低いが、腹を地面に着けない高さを保つ
- {metric: front_knee_z_min_m, min: 0.08, min_fraction: 0.9, comment: 肘・膝を地面に着けて支えていない}
- metric: nose_up_deg
  between: [-12, 12]
  min_fraction: 0.9
  comment: 頭が下がったり上がったりせず、ほぼ水平な姿勢
- {metric: foot_z_max_m, max: 0.09, min_fraction: 0.9, comment: どの足も高く振り上げない。すり足気味にそっと運ぶ（忍び足）。ループ2・1の0.13〜0.15mの大きな振り上げを排除}
- {metric: all_feet_up, max: 0, min_fraction: 0.9, comment: 跳ねたり浮いたりせず、常にどれかの足が接地している}
- metric: dof_vel_rms_mean
  between: [0.7, 4]
  comment: 動きが静かでゆっくりだが、足を動かして歩いている（滑って進んでいない）
- metric: circle_radius_m
  between: [0.3, 1.5]
  comment: 軌跡が適度な半径の円になっている
- {metric: circle_fit_rms_m, max: 0.1, comment: 軌跡が当てはめた円によく沿っている}
- {metric: circle_arc_deg, min: 120, comment: 円の中心まわりに十分な角度を進んでいる}
- {metric: yaw_rate_steady_fraction, min: 0.6, comment: 一定の向きに回り続けている}
- {metric: xy_path_length_m, min: 1, comment: 実際に歩いて移動している}
- {metric: early_terminations, equals: 0, comment: 倒れて打ち切られない}
